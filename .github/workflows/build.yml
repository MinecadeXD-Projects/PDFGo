name: Build PDFGo Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -keystore debug.keystore             -storepass android             -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -noprompt

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PDFGo-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFGo-test-apk
          path: PDFGo-test.apk
          if-no-files-found: error
